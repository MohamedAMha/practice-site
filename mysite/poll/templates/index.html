{% if latest_question_list %} <! -- this variable comes from views -->
  <ul>
      {% for question in latest_question_list %}
      <li>
          <a href="/polls/{{ question.id }}/">{{ question.question_text }}</a>
      </li>
      {% endfor %}
  </ul>
{% else %}
  <p>no polls are available</p>
{% endif %}
