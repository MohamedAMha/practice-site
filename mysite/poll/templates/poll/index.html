{% if latest_question_list %}
  {% comment %}
    "latest_question_list" variable is from views.py
  {% endcomment %}
  <ul>
      {% for question in latest_question_list %}
      <li>
          <a href="{% url 'detail' question.id %}">{{ question.question_text }}</a>
          <! -- be careful of naming of the directory, if you change that it messes the html -->
      </li>
      {% endfor %}
  </ul>
{% else %}
  <p>no polls are available</p>
{% endif %}
